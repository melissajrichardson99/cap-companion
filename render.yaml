services:
  - type: web
    name: cap-companion-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: STAFF_PASSWORD
        sync: false
      - key: STAFF_SESSION_SECRET
        sync: false
      - key: INTERNAL_CLEANUP_SECRET
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      # Reference-cache kill switch (DEPLOYMENT.md section 7). Unset means on;
      # sync: false rather than a value here so a blueprint sync can never
      # reset a "0" set in the dashboard during an incident.
      - key: REFERENCE_CACHE_ENABLED
        sync: false
      # Per-device write-limit kill switch (DEPLOYMENT.md section 8). Unset
      # means on; sync: false for the same reason as above.
      - key: RATE_LIMITS_ENABLED
        sync: false
